spring.application.name=banco-xyz-batch

# ---------------------------------------------------------------------------
# Base de datos destino de la migracion (PostgreSQL en Docker, puerto 5435).
# La misma base guarda los metadatos de Spring Batch (tablas BATCH_*), que son
# las que permiten reanudar un Job caido y auditar el historial de corridas.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5435/banco_xyz
spring.datasource.username=banco
spring.datasource.password=banco123
spring.datasource.driver-class-name=org.postgresql.Driver

# Dimensionado del pool a partir de la concurrencia real, no al reves.
#   Con particiones el paralelismo dentro del Step lo aporta el pool de particiones y no
#   los hilos de chunk, asi que la cuenta se hace sobre ese pool:
#     8 hilos de particiones + 3 hilos de flujos que pueden ejecutar una particion cada uno
#     cuando la cola se llena (CallerRunsPolicy)                       = 11 particiones a la vez
#     x 2 conexiones por particion (su transaccion + la REQUIRES_NEW de la bitacora) = 22
#     + holgura para el JobRepository y los Tasklet de agregacion      = 26
# Se deja en 30, que cubre tambien la estrategia MULTIHILO (3 hilos x 3 flujos x 2 = 18).
# Un pool mas chico que la concurrencia no "ahorra recursos": deja hilos esperando conexion
# y convierte el paralelismo en timeouts.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
# Avisa si un hilo retiene una conexion mas de 20 s: sintoma tipico de un deadlock entre chunks.
spring.datasource.hikari.leak-detection-threshold=20000

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# El batch_size de JDBC agrupa los INSERT de un mismo chunk en una sola ida a la base.
# Con chunks de 5 el valor efectivo es 5; se deja holgado para poder subir el chunk en
# las mediciones de tuning sin tocar dos propiedades a la vez.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Spring Batch
#   initialize-schema=always -> crea las tablas BATCH_* si no existen.
#   job.enabled=false        -> los Jobs no se ejecutan solos al arrancar; los
#                               lanza LanzadorDeJobs segun el parametro --job.
# ---------------------------------------------------------------------------
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ---------------------------------------------------------------------------
# Escalado y procesamiento paralelo
#
#   estrategia: como se reparte el trabajo dentro de un Step de migracion.
#     SECUENCIAL  - un hilo recorre el archivo. Es la linea base de la medicion.
#     MULTIHILO   - un Step con varios hilos sobre el mismo archivo (semana 2).
#     PARTICIONADO- el archivo se divide y cada tramo es un Step propio (semana 3).
#
#   Las tres conviven detras de esta propiedad para poder compararlas con el MISMO
#   jar y el MISMO dato, que es lo que permite afirmar cual es la configuracion
#   optima en vez de suponerlo:
#     --banco.batch.estrategia=SECUENCIAL
#     --banco.batch.estrategia=PARTICIONADO --banco.batch.particiones=8
#
#   particiones=4 es el resultado de la medicion, no un numero elegido al azar:
#   ver evidencias/logs/09_medicion_estrategias.log. La maquina tiene 10 nucleos,
#   asi que subir de ahi reparte el archivo en tramos tan chicos que el costo de
#   levantar cada particion pesa mas que lo que ahorra.
# ---------------------------------------------------------------------------
banco.batch.estrategia=PARTICIONADO
banco.batch.tamano-chunk=5
banco.batch.particiones=8
banco.batch.hilos-de-particiones=8
banco.batch.hilos-por-paso=3
banco.batch.capacidad-cola=25
banco.batch.hilos-de-flujos=3

# ---------------------------------------------------------------------------
# Tolerancia a fallos
#   El limite de omisiones es aproximado con varios hilos: los contadores se
#   consolidan al cerrar cada chunk, de modo que el corte puede pasarse en hasta
#   (hilos - 1) x tamano-chunk filas. Con 3 hilos y chunk 5 el margen es 10.
# ---------------------------------------------------------------------------
banco.batch.limite-omisiones=1000
banco.batch.limite-reintentos=3
banco.batch.limite-reejecuciones=3
banco.batch.backoff-inicial-ms=200
banco.batch.backoff-multiplicador=2.0
banco.batch.backoff-maximo-ms=2000
banco.batch.simular-fallo-transitorio=false

# ---------------------------------------------------------------------------
# Politica de finalizacion: umbrales del decisor de calidad de datos
#   Bajo el 10 % de omisiones la corrida sigue normal; entre 10 % y 30 % se
#   publica el reporte con aviso de cuarentena; sobre el 30 % no se publica y la
#   corrida se deriva a revision manual terminando en fallo (queda reanudable).
# ---------------------------------------------------------------------------
banco.batch.umbral-alerta-omision=0.10
banco.batch.umbral-rechazo-omision=0.30
# Filas minimas por archivo. Detecta el archivo TRUNCADO, que no tiene omisiones y
# por lo tanto daria una tasa de 0 % siendo una perdida total de los datos del dia.
banco.batch.minimo-filas-esperadas=1

# ---------------------------------------------------------------------------
# Reglas de negocio de la migracion
# ---------------------------------------------------------------------------
banco.batch.umbral-monto-atipico=2500
banco.batch.tasa-ahorro=0.00500
banco.batch.tasa-prestamo=0.01500
banco.batch.tasa-hipoteca=0.00900
banco.batch.bonificacion-tercera-edad=0.00100

# ---------------------------------------------------------------------------
# Log de consola.
#   El patron incluye el NOMBRE DEL HILO entre corchetes: es la evidencia directa
#   del procesamiento paralelo. En una corrida con 3 hilos se alternan
#   batch-chunk-1, batch-chunk-2 y batch-chunk-3 sobre las mismas lineas de log.
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bancoxyz=INFO
logging.level.org.springframework.batch=INFO
# El lanzador repite los JobParameters completos en dos lineas; el resumen propio ya los muestra.
logging.level.org.springframework.batch.core.launch.support=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.orm.deprecation=ERROR
# ChunkMonitor avisa "ItemStream was opened in a different thread. Restart data could be
# compromised." en todo Step multihilo. Aqui el aviso no aplica y se silencia a conciencia:
# los lectores llevan saveState(false), asi que NO hay datos de reanudacion que comprometer,
# y la re-ejecucion se resuelve rehaciendo el Step completo tras LimpiezaDeReintentoTasklet.
# Dejarlo en WARN llenaria la evidencia de una alarma que no corresponde a ningun riesgo real.
logging.level.org.springframework.batch.core.step.item.ChunkMonitor=ERROR
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p){highlight} %clr([%-15.15t]){faint} %m%n
