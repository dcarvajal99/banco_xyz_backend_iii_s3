# Perfil de pruebas: H2 en memoria, sin dependencia de Docker ni de PostgreSQL.
spring.datasource.url=jdbc:h2:mem:banco_xyz_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mismo criterio que en produccion: el pool se dimensiona sobre la concurrencia real.
# Sin esto las pruebas del cierre nocturno completo (9 chunks a la vez, cada uno con su
# transaccion mas la REQUIRES_NEW de la bitacora) agotan el pool por defecto de 10.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# El lanzador por linea de comandos se apaga: los Jobs los dispara cada prueba.
banco.batch.lanzador=false

# Escalado bajo prueba: se usan los MISMOS 3 hilos que en produccion, para que las
# pruebas de integracion ejerciten de verdad el camino concurrente. El chunk se deja
# en 2 para que un juego de datos de 8-10 filas produzca varios chunks y los tres
# hilos tengan trabajo que repartirse.
banco.batch.estrategia=PARTICIONADO
banco.batch.tamano-chunk=2
banco.batch.particiones=4
banco.batch.hilos-de-particiones=0
banco.batch.hilos-por-paso=3
banco.batch.capacidad-cola=25
banco.batch.hilos-de-flujos=3

banco.batch.limite-omisiones=50
banco.batch.limite-reintentos=3
banco.batch.limite-reejecuciones=3
banco.batch.backoff-inicial-ms=10
banco.batch.backoff-multiplicador=2.0
banco.batch.backoff-maximo-ms=50
banco.batch.simular-fallo-transitorio=false

# Los juegos de datos de prueba son deliberadamente sucios (hasta un 37 % de filas
# invalidas) para ejercitar la politica de omision. Los umbrales del decisor se suben
# para que ese porcentaje no derive las pruebas a la rama de corte; las tres ramas del
# decisor se prueban aparte, en DecisorCalidadDeDatosTest y PoliticasDeFinalizacionIT.
banco.batch.umbral-alerta-omision=0.90
banco.batch.umbral-rechazo-omision=0.95
banco.batch.minimo-filas-esperadas=1

banco.batch.umbral-monto-atipico=2500
banco.batch.tasa-ahorro=0.00500
banco.batch.tasa-prestamo=0.01500
banco.batch.tasa-hipoteca=0.00900
banco.batch.bonificacion-tercera-edad=0.00100

logging.level.root=WARN
logging.level.com.bancoxyz=INFO
